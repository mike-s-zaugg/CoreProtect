name: Build
on:
  push:
    branches:
      - master
      - 'claude/**'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B verify -Dproject.branch=development
      - name: Check plugin.yml branch
        run: |
          unzip -p target/CoreProtect-*.jar plugin.yml | grep -E '^branch: [^ $]+'
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: CoreProtect-jar
          path: |
            target/CoreProtect-*.jar
            !target/original-*.jar
          if-no-files-found: error
